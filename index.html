<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic-tac-toe: play against a computer that never loses</title>
    <!-- QA: an empty data: icon stops browsers requesting /favicon.ico (R-013: no image files). -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!-- F-014: the X and O pieces, drawn once and used by every square (R-013:
         inline SVG, no image files). The backing disc is transparent except
         on winning tiles, where it keeps the bar under the piece. -->
    <svg
      class="piece-symbols"
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
    >
      <defs>
        <symbol id="mark-x" viewBox="0 0 100 100">
          <circle class="mark-backing" cx="50" cy="50" r="37" />
          <rect
            class="mark-x-bar"
            x="41"
            y="12"
            width="18"
            height="76"
            rx="9"
            transform="rotate(45 50 50)"
          />
          <rect
            class="mark-x-bar"
            x="41"
            y="12"
            width="18"
            height="76"
            rx="9"
            transform="rotate(-45 50 50)"
          />
        </symbol>
        <symbol id="mark-o" viewBox="0 0 100 100">
          <circle class="mark-backing" cx="50" cy="50" r="37" />
          <circle class="mark-o-ring" cx="50" cy="50" r="28" />
        </symbol>
      </defs>
    </svg>
    <main class="page">
      <h1 class="title">Tic-tac-toe</h1>
      <noscript>
        <p class="fallback">
          This game needs JavaScript, which is turned off in this browser. Turn
          it on and reload the page.
        </p>
      </noscript>
      <p id="load-error" class="fallback" hidden>
        The game didn't load. Try reloading the page.
      </p>
      <p id="status" class="status"></p>
      <div id="board" class="board" role="group" aria-label="Board"></div>
      <div id="actions" class="actions"></div>
      <div id="announcer" class="visually-hidden" role="status"></div>
    </main>
    <script>
      // F-011: reveal the load-error message if a script fails to load. Capture
      // phase, because resource error events do not bubble; kept out of the
      // module script so it works when the bundle does not (architecture §2).
      window.addEventListener(
        "error",
        (event) => {
          if (event.target instanceof HTMLScriptElement) {
            document.getElementById("load-error")?.removeAttribute("hidden");
          }
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
